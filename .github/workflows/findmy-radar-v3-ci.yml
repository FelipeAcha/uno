name: FindMy Radar v3 Tahoe CI

on:
  push:
    branches: [findmy-radar-v3-ci]
    paths:
      - 'scratch/findmy-radar-v3/**'
      - '.github/workflows/findmy-radar-v3-ci.yml'
  workflow_dispatch:

jobs:
  tahoe-arm64-compile:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          sw_vers
          uname -m
          xcrun swiftc --version
      - name: Typecheck CoreBluetooth API probe
        run: |
          xcrun swiftc -warnings-as-errors -typecheck \
            scratch/findmy-radar-v3/RadarCompileProbe.swift \
            -framework Foundation -framework CoreBluetooth
      - name: Apply reviewed source corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scratch/findmy-radar-v3/FindMyBLERadar.swift')
          s = p.read_text()
          s = s.replace('$p0.id', '$0.id')
          s = s.replace('let ids = active.map { "\\($0.id):\\(String(format: "%.1f", $0.robustRSSI)" }.joined(separator: "|")',
                        'let ids = active.map { "\\($0.id):\\(String(format: "%.1f", $0.robustRSSI))" }.joined(separator: "|")')
          s = s.replace('strengthBand(score))', 'strengthBand(score: score))')
          s = s.replace('strengthBand(score)))', 'strengthBand(score: score)))')
          p.write_text(s)
          PY
      - name: Typecheck corrected v3 source
        run: |
          xcrun swiftc -typecheck \
            scratch/findmy-radar-v3/FindMyBLERadar.swift \
            -framework Foundation -framework CoreBluetooth
      - name: Compile corrected v3 source
        run: |
          xcrun swiftc -O \
            scratch/findmy-radar-v3/FindMyBLERadar.swift \
            -framework Foundation -framework CoreBluetooth \
            -o /tmp/FindMyBLERadar
      - name: Run v3 parser and scoring self-test
        run: /tmp/FindMyBLERadar --self-test
